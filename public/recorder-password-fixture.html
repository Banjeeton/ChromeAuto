<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recorder Password Fixture</title>
    <style>
      :root { color: #17212b; background: #edf3f7; font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { width: min(92vw, 520px); padding: 42px; border-radius: 22px; background: white; box-shadow: 0 24px 80px rgb(28 55 74 / 16%); }
      .eyebrow { color: #167b92; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 8px 0 12px; }
      p { color: #5c6975; line-height: 1.6; }
      label { display: grid; gap: 7px; margin-top: 24px; color: #43515e; font-size: 13px; font-weight: 700; }
      input { width: 100%; padding: 11px 12px; border: 1px solid #b8c6d1; border-radius: 9px; font: inherit; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Recorder-only verification page</p>
      <h1>Password capture fixture</h1>
      <p>
        Use this isolated page only to verify that Recorder never stores
        password values. Do not use it for Playwright execution checks because
        password managers may inject protected extension frames.
      </p>
      <label>
        Password probe
        <input
          data-recorder-password
          autocomplete="new-password"
          name="recorder-password-probe"
          type="password"
        />
      </label>
    </main>
  </body>
</html>
